<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nouveautés OLA 2.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&display=swap">
<style>
/* Section « Nouveautés » du CRM : un lecteur principal + la liste des vidéos dans l'ordre. Style ola-ai.ca. */
:root {
  --page: #f3f3f1; --bg: #fbfbfa; --surface: #ffffff; --bg-2: #efefec;
  --ink: #0a0a0b; --ink-2: #4b4b52; --ink-3: #86868b; --ink-4: #b8b8bd; --line: #e8e8e6;
  --live: #30d158; --live-ink: #1f9d42;
  --font: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 8px; }
.wrap { max-width: 1320px; margin: 0 auto; padding: 32px max(20px, env(safe-area-inset-right, 0px)) 56px max(20px, env(safe-area-inset-left, 0px)); }

/* En-tête */
header { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; padding-bottom: 28px; }
.logo { width: 56px; height: auto; fill: var(--ink); display: block; margin-bottom: 26px; }
.kick { font-family: var(--mono); font-size: 13px; color: var(--ink-3); margin: 0 0 8px; }
h1 { font-weight: 500; font-size: clamp(30px, 4.4vw, 46px); line-height: 1.06; letter-spacing: -0.04em; margin: 0; text-wrap: balance; }
h1 span { color: var(--ink-3); }

/* Grille : lecteur + liste */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 28px; align-items: start; }
@media (max-width: 960px) { .layout { grid-template-columns: 1fr; } }

.player { min-width: 0; }
.screen { position: relative; aspect-ratio: 16 / 9; max-width: 100%; border-radius: 22px; overflow: hidden; background: #0a0a0b; box-shadow: 0 1px 2px rgba(10,10,11,.05), 0 30px 70px -34px rgba(10,10,11,.35); }
.screen video, .screen iframe, .screen img { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; object-fit: cover; }
.screen video { object-fit: contain; background: #0a0a0b; }
.soon { position: absolute; right: 16px; top: 16px; background: rgba(255,255,255,.94); color: var(--ink); font-size: 14px; font-weight: 500; padding: 8px 14px; border-radius: 999px; }

.info { padding: 26px 4px 0; }
.info .step { font-family: var(--mono); font-size: 13px; color: var(--ink-3); margin: 0 0 8px; }
.info h2 { font-weight: 500; font-size: clamp(24px, 3vw, 32px); line-height: 1.12; letter-spacing: -0.03em; margin: 0; }
.info p.desc { color: var(--ink-2); font-size: 17px; max-width: 66ch; margin: 14px 0 0; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 24px; }
.btn { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 12px 20px; font-weight: 500; cursor: pointer; border: 1px solid var(--line); background: var(--surface); }
.btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
.btn[disabled] { opacity: .4; cursor: default; }

/* Liste des vidéos */
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 10px; }
.list h3 { font-family: var(--mono); font-weight: 400; font-size: 13px; color: var(--ink-3); margin: 10px 12px 8px; }
.list ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.item { width: 100%; display: grid; grid-template-columns: 30px 92px minmax(0, 1fr); gap: 12px; align-items: center; text-align: left; padding: 10px; border: 0; border-radius: 16px; background: transparent; cursor: pointer; }
.item:hover { background: var(--bg); }
.item.current { background: var(--page); }
.num { width: 28px; height: 28px; border-radius: 28px; border: 1.5px solid var(--ink-4); display: grid; place-items: center; font-size: 13px; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.item.current .num { border-color: var(--ink); background: var(--ink); color: #fff; }
.item.done .num { border-color: var(--live); background: var(--live); color: #fff; }
.thumb { width: 92px; aspect-ratio: 16 / 9; border-radius: 10px; object-fit: cover; display: block; background: var(--bg-2); }
.meta { min-width: 0; }
.meta .t { display: block; font-weight: 500; font-size: 15px; line-height: 1.3; }
.meta .d { display: block; font-size: 13px; color: var(--ink-3); margin-top: 2px; }
.start { color: var(--live-ink); font-weight: 500; }

/* Appel de configuration */
.help { margin-top: 14px; background: #18181b; color: #fbfbfa; border-radius: 22px; padding: 22px 24px; }
.help b { display: block; font-weight: 500; font-size: 17px; }
.help span { display: block; color: #b8b8bd; font-size: 14.5px; margin-top: 6px; }

/* Bouton « Toutes les nouveautés » et fenêtre qui s'ouvre */
header { align-items: flex-end; }
.open-feats { display: inline-flex; align-items: center; gap: 10px; font: inherit; font-weight: 500; font-size: 15px; color: var(--ink); background:
  radial-gradient(circle at 15% 50%, rgba(130, 150, 190, 0.35), transparent 60%),
  radial-gradient(circle at 85% 40%, rgba(200, 180, 160, 0.35), transparent 60%), var(--surface);
  border: 1px solid #e2e3e8; border-radius: 999px; padding: 12px 20px; cursor: pointer; transition: border-color .2s, box-shadow .2s; }
.open-feats:hover { border-color: #c9cbd3; box-shadow: 0 6px 18px -10px rgba(10,10,11,.25); }
.open-feats .n { font-family: var(--mono); font-size: 12px; background: var(--ink); color: #fff; border-radius: 999px; padding: 3px 8px; }
dialog.feats-dialog { width: min(860px, calc(100vw - 32px)); max-height: min(86vh, 900px); padding: 0; border: 0; border-radius: 26px; background: var(--bg); color: var(--ink); box-shadow: 0 40px 100px -30px rgba(10,10,11,.45); overflow: hidden; }
dialog.feats-dialog::backdrop { background: rgba(10, 10, 11, 0.35); backdrop-filter: blur(4px); }
dialog.feats-dialog[open] { display: flex; flex-direction: column; animation: pop .25s ease; }
@keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }
.fd-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding: 28px 30px 18px; border-bottom: 1px solid var(--line); }
.fd-head .kick { margin: 0 0 6px; }
.fd-head h2 { font-weight: 500; font-size: clamp(24px, 3vw, 32px); letter-spacing: -0.03em; line-height: 1.1; margin: 0; }
.fd-close { flex: none; width: 40px; height: 40px; border-radius: 40px; border: 1px solid var(--line); background: var(--surface); font-size: 20px; line-height: 1; cursor: pointer; }
.fd-body { min-height: 0; overflow-y: auto; padding: 8px 30px 30px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 34px; }
@media (max-width: 760px) { .fd-body { grid-template-columns: 1fr; } }
.fd-group { padding-top: 22px; min-width: 0; }
.fd-group-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 8px; }
.fd-group h3 { font-weight: 600; font-size: 17px; margin: 0; }
.watch { font: inherit; font-size: 13px; font-weight: 500; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; cursor: pointer; white-space: nowrap; }
.fd-group ul { list-style: none; margin: 0; padding: 0; }
.fd-group li { position: relative; padding: 9px 0 9px 18px; border-top: 1px solid var(--line); font-size: 15px; line-height: 1.45; color: var(--ink-2); }
.fd-group li:first-child { border-top: 0; }
.fd-group li::before { content: ""; position: absolute; left: 0; top: 17px; width: 7px; height: 7px; border-radius: 7px; background: var(--live); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

<div class="wrap">
  <header>
    <div>
      <svg class="logo" role="img" aria-label="OLA"><use href="#ola"/></svg>
      <p class="kick">(Nouveautés)</p>
      <h1>Bienvenue dans OLA 2.0.</h1>
    </div>
    <button class="open-feats" type="button" id="open-feats">✦ Voir toutes les nouveautés <span class="n" id="feats-n">31</span></button>
  </header>

  <div class="layout">
    <main class="player">
      <div class="screen" id="screen"></div>
      <div class="info">
        <p class="step" id="step"></p>
        <h2 id="title"></h2>
        <p class="desc" id="desc"></p>
        <div class="actions">
          <button class="btn" id="prev" type="button">← Précédente</button>
          <button class="btn primary" id="next" type="button">J’ai terminé, vidéo suivante →</button>
        </div>
      </div>
    </main>

    <aside>
      <nav class="list" aria-label="Vidéos">
        <h3>(Les vidéos)</h3>
        <ol id="list"></ol>
      </nav>
      <div class="help">
        <b>On configure tout ça avec vous.</b>
        <span>Écrivez-nous sur Messenger ou dans notre groupe pour réserver votre appel.</span>
      </div>
    </aside>
  </div>

  <dialog class="feats-dialog" id="feats-dialog" aria-labelledby="fd-title">
    <div class="fd-head">
      <div>
        <p class="kick">(OLA 2.0)</p>
        <h2 id="fd-title">Toutes les nouveautés</h2>
      </div>
      <button class="fd-close" type="button" id="fd-close" aria-label="Fermer">×</button>
    </div>
    <div class="fd-body" id="fd-body"></div>
  </dialog>
</div>

    if ((m = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{6,})/))) return 'https://www.youtube.com/embed/' + m[1] + '?rel=0';
    if ((m = url.match(/vimeo\.com\/(?:video\/)?(\d+)/))) return 'https://player.vimeo.com/video/' + m[1];
    if ((m = url.match(/loom\.com\/(?:share|embed)\/([\w]+)/))) return 'https://www.loom.com/embed/' + m[1];
    return null;
  }

  function markDone(i) { state.done[i] = true; save(); renderList(); renderProgress(); }

  function renderScreen(v, i) {
    var el = $('screen');
    el.innerHTML = '';
    if (!v.url) {
      var img = document.createElement('img'); img.src = v.thumb; img.alt = v.title;
      var tag = document.createElement('span'); tag.className = 'soon'; tag.textContent = 'Vidéo bientôt disponible';
      el.appendChild(img); el.appendChild(tag);
      return;
    }
    var src = embed(v.url);
    if (src) {
      var f = document.createElement('iframe');
      f.src = src; f.title = v.title;
      f.allow = 'autoplay; fullscreen; picture-in-picture'; f.allowFullscreen = true;
      el.appendChild(f);
    } else {
      var vid = document.createElement('video');
      vid.src = v.url; vid.poster = v.thumb; vid.controls = true; vid.playsInline = true; vid.preload = 'metadata';
      vid.addEventListener('ended', function () { markDone(i); });
      el.appendChild(vid);
    }
  }

  function renderList() {
    var ol = $('list'); ol.innerHTML = '';
    VIDEOS.forEach(function (v, i) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'item' + (i === state.current ? ' current' : '') + (state.done[i] ? ' done' : '');
      b.setAttribute('aria-current', i === state.current ? 'true' : 'false');
      b.innerHTML = '<span class="num">' + (state.done[i] ? '✓' : (i + 1)) + '</span>' +
        '<img class="thumb" alt="" src="' + v.thumb + '">' +
        '<span class="meta"><span class="t"></span><span class="d"></span></span>';
      b.querySelector('.t').textContent = v.title;
      var d = b.querySelector('.d');
      if (i === 0 && !state.done[0]) { d.innerHTML = '<span class="start">Commencez ici</span> · ' + v.length; }
      else d.textContent = (state.done[i] ? 'Vue · ' : '') + v.length;
      b.addEventListener('click', function () { go(i); });
      li.appendChild(b); ol.appendChild(li);
    });
  }

  function renderProgress() {}

  function go(i) {
    state.current = Math.max(0, Math.min(VIDEOS.length - 1, i)); save();
    var v = VIDEOS[state.current];
    renderScreen(v, state.current);
    $('step').textContent = 'Vidéo ' + (state.current + 1) + ' sur ' + VIDEOS.length + ' · ' + v.length;
    $('title').textContent = v.title;
    $('desc').textContent = v.desc;
    $('prev').disabled = state.current === 0;
    $('next').textContent = state.current === VIDEOS.length - 1 ? 'J’ai terminé ✓' : 'J’ai terminé, vidéo suivante →';
    renderList(); renderProgress();
  }

  $('prev').addEventListener('click', function () { go(state.current - 1); });
  $('next').addEventListener('click', function () {
    markDone(state.current);
    if (state.current < VIDEOS.length - 1) { go(state.current + 1); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  });

  go(state.current || 0);

  /* ----- Toutes les nouveautés : liste dans une fenêtre qui s'ouvre et se referme ----- */
  var FEATURES = [
    { title: "Pipeline", video: 1, items: [
      "Déposez un CCA ou un CCV : OLA crée la fiche et les contacts pour vous",
      "Remplissez vos formulaires OACIQ à partir du CRM et envoyez-les dans Instanet, prêts à signer",
      "Faites remplir certaines questions d’un formulaire par votre client",
      "Liez la propriété à la fiche avec son numéro MLS, et ajoutez tous les acheteurs ou propriétaires",
      "Retrouvez les demandes d’infos et les visites de l’inscription directement dans la fiche",
      "Déposez la promesse d’achat : les dates de conditions sont extraites et calculées en jours",
      "Fixez vos délais par défaut et vos rappels automatiques, pour vous et pour votre client",
      "Cochez vos conditions complétées directement depuis le pipeline",
      "Annoncez la mise en ligne à votre vendeur en un clic, avec le lien Centris inclus"
    ]},
    { title: "Historique et relations clients", video: 2, items: [
      "Glissez une transaction notariée dans « Gagné » pour la finaliser",
      "Suivez votre volume, vos commissions et votre prix moyen, en ventes et en achats",
      "Retrouvez le dossier complet de chaque ancienne transaction",
      "Bâtissez votre plan de suivi après la vente : texto, courriel, appel ou mot écrit",
      "Envoyez en un clic des suivis déjà rédigés, ou laissez-les partir automatiquement"
    ]},
    { title: "Portail client", video: 3, items: [
      "Bâtissez le parcours acheteur et vendeur de vos clients, étape par étape",
      "Choisissez à quelle étape du pipeline votre client reçoit son accès",
      "Mettez le portail à votre image : logo, couleur, message et vidéo d’accueil",
      "Ajoutez vos professionnels recommandés (courtier hypothécaire, notaire, inspecteur)",
      "Voyez si votre client utilise son portail, et ajoutez-lui des tâches ou des formulaires",
      "Votre client suit sa transaction, ses tâches et ses rendez-vous au même endroit",
      "Votre client gère ses alertes Matrix à partir de son portail : il swipe les propriétés et demande les documents",
      "Votre vendeur voit l’activité Centris de son inscription (option désactivable)"
    ]},
    { title: "Mes inscriptions", video: 6, items: [
      "Reliez le statut de vos inscriptions aux étapes de votre pipeline",
      "Choisissez l’envoi des documents automatique ou avec confirmation, par inscription",
      "Annoncez la mise en ligne depuis l’inscription",
      "Recontactez vos demandes d’infos, même pour leur proposer une propriété semblable",
      "Publiez vos propriétés sur votre Facebook et votre Instagram personnels avec Muse, à partir des photos du CRM"
    ]},
    { title: "L’IA d’OLA", video: 7, items: [
      "OLA fait ce que vous voulez qu’elle fasse dans votre CRM : la seule limite, ce sont vos besoins",
      "Parlez-lui et elle agit pour vous : rendez-vous, tâches, documents, envois de masse",
      "Confiez-lui des tâches récurrentes et la qualification de vos leads",
      "Donnez-lui votre façon de parler, et utilisez-la sur l’app mobile, à la voix"
    ]}
  ];

  var dlg = $('feats-dialog'), body = $('fd-body'), count = 0;
  FEATURES.forEach(function (grp) {
    var g = document.createElement('div'); g.className = 'fd-group';
    var head = document.createElement('div'); head.className = 'fd-group-head';
    var h = document.createElement('h3'); h.textContent = grp.title;
    var w = document.createElement('button'); w.type = 'button'; w.className = 'watch'; w.textContent = '▶ Vidéo';
    w.addEventListener('click', function () { dlg.close(); go(grp.video); window.scrollTo({ top: 0, behavior: 'smooth' }); });
    head.appendChild(h); head.appendChild(w); g.appendChild(head);
    var ul = document.createElement('ul');
    grp.items.forEach(function (txt) { var li = document.createElement('li'); li.textContent = txt; ul.appendChild(li); count++; });
    g.appendChild(ul); body.appendChild(g);
  });
  $('feats-n').textContent = count;
  $('open-feats').addEventListener('click', function () { dlg.showModal(); body.scrollTop = 0; });
  $('fd-close').addEventListener('click', function () { dlg.close(); });
  dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); });

})();
</script>
